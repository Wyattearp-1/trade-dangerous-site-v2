name: Refresh trade data

on:
  schedule:
    # Every 3 hours (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Data source (eddblink = faster; spansh = fuller dump)"
        required: true
        default: eddblink
        type: choice
        options:
          - eddblink
          - spansh
          - sample

permissions:
  contents: write

concurrency:
  group: refresh-trade-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild trade data (sharded if large)
        env:
          # Scheduled runs default to eddblink (minutes, not 10–15+).
          # Manual "spansh" still available for a fuller rebuild.
          TD_SOURCE: ${{ github.event.inputs.source || 'eddblink' }}
          TD_MAX_STATIONS: "20000"
          TD_MAX_LY: "800"
          TD_MAX_SHARD_BYTES: "40000000"
        run: |
          set -e
          echo "Building with source=$TD_SOURCE max_stations=$TD_MAX_STATIONS max_ly=$TD_MAX_LY"
          python build_data.py --out trade-data.json
          echo "=== output files ==="
          ls -lh trade-data.json trade-data-*.json 2>/dev/null || ls -lh trade-data.json
          for f in trade-data.json trade-data-*.json; do
            [ -f "$f" ] || continue
            SIZE=$(wc -c < "$f")
            echo "$f = $SIZE bytes"
            if [ "$SIZE" -gt 95000000 ]; then
              echo "::error::$f exceeds 95MB ($SIZE). Lower TD_MAX_SHARD_BYTES."
              exit 1
            fi
          done

      - name: Commit and push if data changed
        run: |
          set -e
          git config user.name "trade-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- trade-data.json
          git add -- trade-data-*.json 2>/dev/null || true
          git ls-files -z -- 'trade-data*.json' | xargs -0 -r git add -u --

          git status

          if git diff --cached --quiet; then
            echo "No change in trade data, nothing to commit."
            exit 0
          fi

          git commit -m "Refresh trade data ($(date -u +'%Y-%m-%d %H:%M UTC')) [${{ github.event.inputs.source || 'eddblink' }}]"

          git checkout -- . 2>/dev/null || true
          git clean -fd -- 'trade-data*.json' 2>/dev/null || true

          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt on $BRANCH…"
            git fetch origin "$BRANCH"
            if git pull --rebase --autostash origin "$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                echo "Push succeeded."
                exit 0
              fi
            fi
            echo "Rebase/push failed; retrying…"
            git rebase --abort 2>/dev/null || true
            sleep 8
          done

          echo "::error::Could not push after retries. Re-run this workflow when no other pushes are in progress."
          exit 1
