name: Refresh trade data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Data source"
        required: true
        default: spansh
        type: choice
        options:
          - spansh
          - eddblink
          - sample

permissions:
  contents: write

concurrency:
  group: refresh-trade-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the bot can push back to main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild trade data (sharded if large)
        env:
          TD_SOURCE: ${{ github.event.inputs.source || 'spansh' }}
          TD_MAX_STATIONS: "25000"
          TD_MAX_LY: "800"
          TD_MAX_SHARD_BYTES: "40000000"
        run: |
          set -e
          python build_data.py --out trade-data.json
          echo "=== output files ==="
          ls -lh trade-data.json trade-data-*.json 2>/dev/null || ls -lh trade-data.json
          for f in trade-data.json trade-data-*.json; do
            [ -f "$f" ] || continue
            SIZE=$(wc -c < "$f")
            echo "$f = $SIZE bytes"
            if [ "$SIZE" -gt 95000000 ]; then
              echo "::error::$f exceeds 95MB ($SIZE). Lower TD_MAX_SHARD_BYTES."
              exit 1
            fi
          done

      - name: Commit and push if data changed
        run: |
          set -e
          git config user.name "trade-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trade-data.json
          git add -A -- trade-data-*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No change in trade data, nothing to commit."
            exit 0
          fi

          git commit -m "Refresh trade data ($(date -u +'%Y-%m-%d %H:%M UTC')) [${{ github.event.inputs.source || 'spansh' }}]"

          # Remote may have moved (manual uploads while this job ran).
          # Rebase our data commit on top of latest main, then push.
          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            echo "Push attempt $attempt on $BRANCH…"
            git fetch origin "$BRANCH"
            if git pull --rebase origin "$BRANCH"; then
              if git push origin "HEAD:$BRANCH"; then
                echo "Push succeeded."
                exit 0
              fi
            fi
            echo "Rebase/push conflicted or rejected; retrying…"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "::error::Could not push after retries. Re-run this workflow after other pushes finish."
          exit 1
